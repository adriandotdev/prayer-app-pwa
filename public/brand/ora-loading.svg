<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="loading-title">
  <title id="loading-title">Loading</title>
  <style>
    svg{--ora-gold:#c9a24b}
    .beads{fill:currentColor;opacity:.3}
    .h{fill:var(--ora-gold);opacity:0;animation:glow 1.8s ease-in-out infinite}
    .h:first-child{opacity:1}
    @keyframes glow{0%,100%{opacity:0}6%,12%{opacity:1}25%{opacity:0}}
    .h:nth-child(1){animation-delay:-1.8s}.h:nth-child(2){animation-delay:-1.65s}
    .h:nth-child(3){animation-delay:-1.5s}.h:nth-child(4){animation-delay:-1.35s}
    .h:nth-child(5){animation-delay:-1.2s}.h:nth-child(6){animation-delay:-1.05s}
    .h:nth-child(7){animation-delay:-.9s}.h:nth-child(8){animation-delay:-.75s}
    .h:nth-child(9){animation-delay:-.6s}.h:nth-child(10){animation-delay:-.45s}
    .h:nth-child(11){animation-delay:-.3s}.h:nth-child(12){animation-delay:-.15s}
    @media (prefers-reduced-motion:reduce){.h{animation:none;opacity:0}.h:first-child{opacity:1}}
  </style>
